name: 资治通鉴每日推送

on:
  schedule:
    - cron: '0 0 * * *'    # 08:00 北京时间 → 晨读
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只校验内容，不发送企业微信、不推进进度"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zizhi-daily-push
  cancel-in-progress: false

jobs:
  push-to-wechat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 校验深读内容
        run: python scripts/deep_read_content.py --validate

      - name: 发送企业微信推送
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          WECHAT_WORK_WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
        run: python push.py

      # 进度提交回仓库：既是断点续推的存档，也让仓库保持活跃，
      # 避免 GitHub「60 天无提交自动停用 schedule」
      - name: 提交进度
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if ! git diff --cached --quiet; then
            NUM=$(python -c "import json; print(json.load(open('progress.json'))['last'])")
            git commit -m "progress: 第${NUM}篇已推送"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase
            done
            exit 1
          fi
